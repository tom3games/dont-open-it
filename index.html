<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script id="ghMove">if(location.hostname==='tom3games.github.io'){location.replace('https://tom3games.com/play/dont-open-it/'+location.search+location.hash)}</script>
<link rel="canonical" href="https://tom3games.com/play/dont-open-it/">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>その通知、開くな｜スマホを我慢するバカゲー</title>
<meta name="description" content="明日は期末テスト。机のスマホに「推しが生配信」「あなたの悪口が書かれています」と通知が鳴りやまない。勝手にスマホへ伸びる自分の手をはたき、本物の至急だけは開いて、朝6時まで勉強するブラウザゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="その通知、開くな">
<meta property="og:description" content="テスト前夜、通知が鳴りやまない。勝手に伸びる自分の手をはたいて朝まで耐えろ。">
<meta property="og:image" content="https://tom3games.com/play/dont-open-it/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tom3games.com/play/dont-open-it/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1d2340">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
<script>window.__bootN=0;window.__bootStep=function(){var n=++window.__bootN,b=document.getElementById('bootBar');if(b)b.style.transform='scaleX('+Math.min(1,n/8)+')'}</script>
<link rel="preload" as="image" href="img/desk.webp" onload="__bootStep()">
<link rel="preload" as="image" href="img/hw_write.webp" onload="__bootStep()">
<link rel="preload" as="image" href="img/i_note.webp" onload="__bootStep()">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="dawn"></div>
  <img id="iBooks" class="obj" src="img/i_books.webp" alt="">
  <div id="phone" class="obj">
    <div class="scr">
      <div class="lk-bar"><span>4G</span><i class="batt"><b id="batt"></b></i></div>
      <div class="lk-time" id="pTime">22:00</div>
      <div class="lk-date" id="pDate"></div>
      <div id="cards"></div>
      <div id="more"></div>
      <div id="alarmUI" hidden><b>6:00</b><span id="alarmTxt"></span></div>
    </div>
  </div>
  <img id="iCat" class="obj" src="img/i_cat.webp" alt="" hidden>
  <div id="note" class="obj"><img src="img/i_note.webp" alt=""><canvas id="ink"></canvas><span id="pageNo">p.1</span></div>
  <img id="iMug" class="obj item" src="img/i_mug.webp" alt="">
  <img id="iMarker" class="obj item" src="img/i_marker.webp" alt="">
  <img id="iEraser" class="obj item" src="img/i_eraser.webp" alt="">
  <div id="armL" class="arm left"><div class="sleeve"></div><img alt=""><i class="band" hidden></i></div>
  <div id="armR" class="arm"><div class="sleeve"></div><img alt=""><i class="band" hidden></i></div>
  <div id="finger" hidden><svg viewBox="0 0 60 70"><path d="M22 6c4-2 8 0 8 5v22l3-1c3-1 6 1 6 4l2-1c3-1 6 1 6 4l2 0c3 0 5 2 5 5v12c0 8-6 13-14 13H30c-6 0-10-3-13-8L7 44c-2-3 0-6 3-6 2 0 4 1 6 3l2 3V11c0-2 2-4 4-5z" fill="#fff" stroke="#1d1a17" stroke-width="3.5" stroke-linejoin="round"/></svg></div>
</div>

<div id="voice" aria-live="polite"></div>
<div id="hint" hidden></div>
<div id="banner"></div>

<main id="vTitle" hidden>
  <div class="ttl" id="ttl">
    <h1><span id="t1"></span><b id="t2"></b></h1>
    <p id="tSub"></p>
  </div>
  <div class="tbtns">
    <button id="bStart" class="go"></button>
    <div class="row"><button id="bHow" class="pen"></button><button id="bLang" class="pen"></button></div>
  </div>
</main>

<main id="vHow" hidden>
  <div class="leaf">
    <h2 id="howH"></h2>
    <ol id="howRules"></ol>
    <p class="note2" id="howNote"></p>
    <button id="bHowClose" class="go"></button>
    <p class="foot"><a id="lPrivacy" href="privacy.html" target="_blank" rel="noopener"></a><span id="howCredit"></span></p>
  </div>
</main>

<div id="overlay" hidden>
  <div class="ov-phone">
    <div class="ov-head" id="ovHead"><i id="ovIcon"></i><b id="ovApp"></b></div>
    <div class="ov-body" id="ovBody"></div>
    <div class="ov-clock" id="ovClock"></div>
  </div>
</div>

<main id="vResult" hidden>
  <div class="cardbox" id="cardBox"><canvas id="card" width="720" height="1080"></canvas></div>
  <div class="rbtns"><button id="bSave" class="pen"></button><a id="bPost" class="pen" target="_blank" rel="noopener"></a></div>
  <div class="rrow"><button id="bAgain" class="go"></button></div>
</main>

<button id="bMute" aria-label="sound"><svg viewBox="0 0 32 32"><path d="M5 12h6l7-6v20l-7-6H5z" fill="currentColor"/><path id="mWave" d="M22 11q4 5 0 10M25 8q7 8 0 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path id="mX" d="M22 12l8 8M30 12l-8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>

<div id="boot">
  <svg viewBox="0 0 200 140" aria-hidden="true">
    <path d="M10 112h180l-8 18H18z" fill="#c98a4b" stroke="#2b1d14" stroke-width="3" stroke-linejoin="round"/>
    <g class="buzz"><rect x="62" y="86" width="76" height="24" rx="7" fill="#22252c" stroke="#111" stroke-width="3"/><circle cx="76" cy="98" r="3" fill="#555"/><path d="M50 84l-8-7M150 84l8-7M48 100h-10M152 100h10" stroke="#ffd34d" stroke-width="3.5" stroke-linecap="round"/></g>
  </svg>
  <p id="bootMsg">通知を切っています</p>
  <div class="boot-bar"><i id="bootBar"></i></div>
</div>

<script>
(function(){var o={passive:false};
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},o)});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},o);
var l=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-l<300&&!(e.target.closest&&e.target.closest('button,a,.card')))e.preventDefault();l=n},o);
document.addEventListener('dblclick',function(e){e.preventDefault()},o);
window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},o);
window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
try{var q=new URLSearchParams(location.search).get('lang');if((q||localStorage.getItem('dn_lang')||((navigator.language||'ja').indexOf('ja')==0?'ja':'en'))=='en')document.getElementById('bootMsg').textContent='Silencing notifications'}catch(e){}
setTimeout(function(){window.__bootTimeout=!window.__bootDone;document.getElementById('boot').classList.add('gone')},12000);
var errs=[];window.addEventListener('error',function(e){errs.push((e.message||(e.target&&(e.target.src||e.target.href))||'error')+(e.filename?' @'+e.filename+':'+e.lineno:''))},true);
window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+String(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(window.__jsUp)return;var d=document.createElement('div');d.id='bootErr';d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;document.body.appendChild(d)},15000)})();
</script>
<script src="tm.js?v=1" data-game="dont-open-it"></script>
<script src="sfx.js?v=1"></script>
<script src="data.js?v=1"></script>
<script src="game.js?v=1"></script>
<script src="support.js?v=1" data-ja="缶コーヒー" data-en="a can of coffee"></script>
</body>
</html>
